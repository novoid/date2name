[project]
name = "date2name"
description = "Handling time-stamps and date-stamps in file names"
version = "2026.03.01.1"
license = "GPL-3.0-or-later"
readme = { file = "README.org", content-type = "text/plain" }
keywords = ["file managing", "file management", "files", "date", "time", "time-stamps"]
classifiers=[
    "Programming Language :: Python :: 3 :: Only",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    ]
requires-python = ">=3.10"
authors = [{name="Karl Voit", email="tools@Karl-Voit.at"}]

[project.urls]
Homepage = "https://github.com/novoid/date2name"
Repository = "https://github.com/novoid/date2name"
Issues = "https://github.com/novoid/date2name/issues"

[project.scripts]
date2name="date2name:main"

[[tool.uv.index]]
name = "date2name"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.setuptools.packages.find]
include = ["date2name*"]

[build-system]
requires = ["setuptools>=78.1.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2"
]

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCacheWarning"]
markers = [
    "elementary:  elementary tests ahead of action on files/folders by date2name",
    "files:       tests about affect by date2name on files",
    "folders:     tests about affect by date2name on folders",
    "default:     stamp pattern default, YYYY-MM-DD",
    "compact:     stamp pattern compact, YYYYMMDD",
    "month:       stamp pattern month, YYYY-MM",
    "short:       stamp pattern short, YYMMDD",
    "withtime:    stamp pattern withtime, YYYY-MM-DDThh.mm.ss",
    "remove:      stamp retraction",
]
minversion = "9"
log_level = "INFO"
strict = true
addopts = ["-ra"]

[tool.mypy]
strict = true
ignore_missing_imports = true


